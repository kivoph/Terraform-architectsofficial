  b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--red);color:#fff;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:14px;line-height:1.4;display:flex;gap:12px;align-items:center;justify-content:space-between';

/* Navigation: every page has a Back button. It uses the browser history when there is one, otherwise goes to the parent page. */
const hs=()=>{try{return history.state}catch(e){return null}};
function nav(t,dp){const n=((hs()&&hs().n)||0)+1;S.tab=t;S.dp=dp==null?-1:dp;save();try{history.pushState({t:S.tab,dp:S.dp,n},'')}catch(e){}draw();window.scrollTo(0,0)}
function parentOf(){if(S.tab=='ong'&&S.dp>=0)return['ong',-1];if(SECS[S.tab])return['home',-1];return[secOf(S.tab)||'home',-1]}
function back(){const h=hs();if(h&&h.n>0){try{history.back();return}catch(e){}}const p=parentOf();S.tab=p[0];S.dp=p[1];save();draw();window.scrollTo(0,0)}
addEventListener('popstate',e=>{if(!S.me)return;const s=e.state;if(s&&s.t&&ok(s.t)){S.tab=s.t;S.dp=s.dp==null?-1:s.dp}else{S.tab='home';S.dp=-1}save();draw()});
function bar(){
  if(S.tab=='home')return'';
  const sp='<span class="sep">/</span>';
  let c='<button type="button" class="btn back" onclick="back()">Back</button><div class="crumbs"><button type="button" class="crumb" onclick="nav(\'home\')">Home</button>'+sp;
  if(SECS[S.tab])c+=`<span class="cur">${SECS[S.tab][0]}</span>`;
  else{const s=secOf(S.tab);c+=`<button type="button" class="crumb" onclick="nav('${s}')">${SECS[s][0]}</button>${sp}`;
    if(S.tab=='ong'&&S.dp>=0&&S.dt[S.dp])c+=`<button type="button" class="crumb" onclick="nav('ong')">${L.ong}</button>${sp}<span class="cur">${esc(S.dt[S.dp].n)}</span>`;
    else c+=`<span class="cur">${L[S.tab]}</span>`}
  return c+'</div>'}
function secView(k){const s=SECS[k];return `<h2>${s[0]}</h2><p class="mut lead">${s[2]}</p><div class="grid">${s[3].map(p=>`<button type="button" class="card nav-card" onclick="nav('${p}')"><b>${L[p]}</b><span class="mut">${PD[p]}</span></button>`).join('')}</div>`}

/* Labor, income and budget numbers used by several pages */
const otr=w=>(+w.ot)||((+w.rate||0)/8*1.25);
const attPay=a=>{const w=S.wr[a.w];return w?(+a.d||0)*(+w.rate||0)+(+a.oh||0)*otr(w):0};
const laborAtt=p=>S.at.filter(a=>a.p==p).reduce((t,a)=>t+attPay(a),0);
function fin(p){
  const sc=s=>S.sc[p+'|'+s]||{c:0,e:0};let contract=0,budget=0;
  SC.forEach(s=>{contract+=+sc(s).c||0;budget+=+sc(s).e||0});
  const aw=tot(S.vo.filter(v=>v.p==p),'price'),exp=tot(S.ex.filter(e=>e.p==p)),lab=laborAtt(p),sb=tot(S.sb.filter(b=>b.p==p));
  const inc=tot(S.inc.filter(i=>i.p==p)),billed=SC.reduce((t,s)=>t+(+sc(s).c||0)*(bdel(p).prev[s]||0)/100,0),inv=tot(S.iv.filter(i=>i.p==p));
  const value=contract+aw,cost=exp+lab+sb;
  return{contract,budget,aw,value,exp,lab,sb,cost,inc,billed,inv,remBudget:budget-cost,remBal:value-inc}}

function pie(m){const t=Object.values(m).reduce((a,b)=>a+b,0);if(!t)return '<p class="mut">No data yet.</p>';

cv(){if(S.role!='admin')return'';const k=s=>S.proj+'|'+s;const c=s=>S.sc[k(s)]||{c:0,e:0};const L2=pex();let tc=0,te=0,ta=0;

  const put=data=>{const old=p.docs[k];p.docs[k]={name:f.name,type:data.slice(5,data.indexOf(';')),data,date:today()};
    try{localStorage.setItem('ccc',JSON.stringify(S))}catch(e){if(old)p.docs[k]=old;else delete p.docs[k];alert('Browser storage is full. The file was not saved. Try a smaller file.')}draw()};
  if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);put(c.toDataURL('image/jpeg',0.7))};im.src=r.result};r.readAsDataURL(f)}
  else if(f.type=='application/pdf'){if(f.size>1258291){alert('This PDF is larger than 1.2 MB. Please attach a smaller PDF or a photo of the document.');inp.value='';return}const r=new FileReader();r.onload=()=>put(r.result);r.readAsDataURL(f)}
  else{alert('Please attach a PDF or a photo.');inp.value=''}}
function viewDoc(k){const dd=(S.dt[DJ].docs||{})[k];if(!dd)return;
  const pt=dd.data.split(','),mime=(pt[0].match(/:(.*?);/)||[])[1]||dd.type,bin=atob(pt[1]),ar=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)ar[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([ar],{type:mime})),d=document.createElement('div');d.className='ov';d.setAttribute('role','dialog');
  d.innerHTML='<div class="ovbar"><button type="button" class="btn back">Back</button> <a class="btn" href="'+url+'" download="'+esc(dd.name)+'">Download</a></div>'+(mime.startsWith('image/')?'<img alt="'+esc(dd.name)+'" src="'+url+'">':'<iframe title="'+esc(dd.name)+'" src="'+url+'" style="width:min(100%,900px);height:80vh;height:80dvh;border:0;background:#fff;border-radius:10px"></iframe><p class="mut" style="color:#fff">If the PDF does not show, tap Download.</p>');
  const close=()=>{d.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',onKey)},onKey=e=>{if(e.key=='Escape')close()};
  d.querySelector('.back').onclick=close;d.onclick=e=>{if(e.target===d)close()};document.addEventListener('keydown',onKey);document.body.appendChild(d)}

  <h3>Contract fee and documents</h3><div class="grid" style="margin-bottom:12px"><div class="card"><label for="dj_fee">Contract fee (PHP)</label><input id="dj_fee" type="number" step="any" inputmode="decimal" value="${f.fee}" onchange="S.dt[DJ].fee=Math.max(0,+this.value||0);save();draw()"><p class="mut" style="margin:8px 0 0">Billed ${$(f.billed)} | Not yet billed <span class="${f.left<0?'red':''}">${$(f.left)}</span></p></div>${docCard('contract')}${docCard('proposal')}</div>

/* Graph on the Expenses page: percent of budget spent (admin) or where the spending goes (staff) */
function expGraph(L2){
  const adm=S.role=='admin',T=sum(L2),f=fin(S.proj),byTag={};
  L2.forEach(e=>byTag[e.sc]=(byTag[e.sc]||0)+(+e.amt||0));
  if(adm){
    const est=s=>+((S.sc[S.proj+'|'+s]||{}).e)||0;
    const items=f.budget?[{l:'All expenses',v:T/f.budget*100,t:(T/f.budget*100).toFixed(1)+'%'}].concat(SC.filter(s=>est(s)>0).map(s=>{const p=(byTag[s]||0)/est(s)*100;return{l:s,v:p,t:p.toFixed(1)+'%'}})):[];
    return `<h3>Percent of budget spent</h3><div class="card" style="margin-bottom:12px">${items.length?bars(items):'<p class="mut">Enter the estimates first in Contract & Variance to see the percent of budget spent.</p>'}<p style="margin:12px 0 0"><button type="button" class="btn" onclick="nav('bu')">See budget used per week, month and year</button></p></div>`}
  return `<h3>Where the spending goes</h3><div class="card" style="margin-bottom:12px">${bars(SC.filter(s=>byTag[s]).map(s=>({l:s,v:byTag[s]/T*100,t:(byTag[s]/T*100).toFixed(1)+'%'})))}</div>`}

function dlFile(name,text,mime){const b=new Blob([text],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}

function restoreBackup(inp){if(S.role!='admin')return;const f=inp.files[0];inp.value='';if(!f)return;
  const r=new FileReader();r.onerror=()=>alert('The file could not be read.');
  r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){alert('This is not a valid backup file.');return}
    const n=o&&o.app&&o.data;
    if(!n||typeof n!='object'||!Array.isArray(n.users)||!n.users.some(u=>u&&u.role=='admin'&&u.h)||AT.some(k=>n[k]!==undefined&&!Array.isArray(n[k]))){alert('This is not a Terraform backup file, or it is damaged. Nothing was changed.');return}
    const c=k=>Array.isArray(n[k])?n[k].length:0;
    if(!confirm('Restore the backup made on '+String(o.date||'').slice(0,10)+'?\n\nIt has '+c('ex')+' expenses, '+c('wr')+' workers and '+c('dt')+' design projects.\n\nThis REPLACES all data in this browser. A copy of the current data will be downloaded first.'))return;
    downloadBackup('before-restore');
    n.me=S.me;n.role=S.role;n.tab='home';n.dp=-1;
    try{localStorage.setItem('ccc',JSON.stringify(n))}catch(e){alert('Browser storage is full, so the backup could not be restored. Nothing was changed.');return}
    location.reload()};
  r.readAsText(f)}
const csvCell=v=>{let t=v==null?'':String(v);if(typeof v=='string'&&(/^[=+@\t\r]/.test(t)||/^-[^0-9.\s]/.test(t)))t="'"+t;return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
function csvVal(k,f,v){
  if(f=='p'||(k=='tool'&&f=='site'))return typeof v=='number'||/^\d+$/.test(String(v))?(P[+v]||v):v;
  if(k=='at'&&f=='w')return(S.wr[v]||{}).name||v;
  if(k=='sb'&&f=='si')return(S.sub[v]||{}).name||v;
  if(k=='at'&&f=='d')return({1:'Present',0.5:'Half day',0:'Absent'})[v]||v;
  if(f=='img')return v?'Yes':'';
  if(f=='docs'&&v&&typeof v=='object')return Object.entries(v).map(([a,b])=>a+': '+(b&&b.name||'')).join('; ');
  if(Array.isArray(v))return v.map(x=>x&&typeof x=='object'?JSON.stringify(x):x).join('; ');
  if(v&&typeof v=='object')return JSON.stringify(v);
  return v}
function exportCsv(k){if(S.role!='admin')return;
  const keys=k=='all'?CSVK.filter(x=>Array.isArray(S[x])&&S[x].length):[k];
  if(!keys.length||!Array.isArray(S[keys[0]])){alert('There is nothing to export yet.');return}
  const cols=[];keys.forEach(t=>S[t].forEach(x=>Object.keys(x||{}).forEach(f=>{if(f!='data'&&!cols.some(c=>c.k==t+'|'+f||(k=='all'&&c.f==f&&c.same)))cols.push({k:t+'|'+f,f,t,same:k=='all'})})));
  const colf=[...new Set(cols.map(c=>c.f))];
  const head=(k=='all'?['Table']:[]).concat(colf.map(f=>KO[(keys[0]||'')+'.'+f]||KL[f]||f));
  const rows=[];keys.forEach(t=>S[t].forEach(x=>{if(!x||typeof x!='object')return;rows.push((k=='all'?[tlName(t)]:[]).concat(colf.map(f=>csvCell(csvVal(t,f,x[f])))))}));
  const text='\ufeff'+[head.map(csvCell)].concat(rows).map(r=>r.join(',')).join('\r\n');
  dlFile('terraform-'+(k=='all'?'all-tables':k)+'-'+today()+'.csv',text,'text/csv;charset=utf-8')}

const FDB=(()=>{let pr;const open=()=>pr||(pr=new Promise((res,rej)=>{try{const r=indexedDB.open('terraform-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('f',mode),q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
  return{put:(k,b)=>run('readwrite',s=>s.put(b,k)),get:k=>run('readonly',s=>s.get(k)),del:k=>run('readwrite',s=>s.delete(k))}})();
const UPMAX={video:157286400,document:26214400};
const upKind=f=>{const t=f.type||'';return t.startsWith('image/')?'photo':t.startsWith('video/')?'video':'document'};
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function shrinkImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('image')),'image/jpeg',0.75)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image'))};im.src=u})}
async function doUpload(form){
  const inp=form.querySelector('input[type=file]'),files=[...inp.files],note=(form.elements.note.value||'').trim(),btn=form.querySelector('button.p');
  if(!files.length){alert('Choose at least one file.');return false}
  btn.disabled=true;btn.textContent='Uploading...';const bad=[];let n=0;
  for(const f of files){
    try{const k=upKind(f);let blob=f,mime=f.type||'application/octet-stream';
      if(k=='photo'){try{blob=await shrinkImg(f);mime='image/jpeg'}catch(e){blob=f}}
      else if(blob.size>UPMAX[k]){bad.push(f.name+' (too large, max '+fmtSize(UPMAX[k])+')');continue}
      const id='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      await FDB.put(id,blob);
      S.up.push({id,p:S.proj,date:today(),kind:k,name:f.name,mime,size:blob.size,note,by:S.me});n++}
    catch(e){bad.push(f.name+' (could not be saved)')}}
  save();draw();
  if(bad.length)alert((n?n+' file(s) uploaded. ':'')+'Not uploaded: '+bad.join(', '));
  return false}
async function upView(id){
  const m=S.up.find(x=>x.id==id);if(!m)return;let b=null;try{b=await FDB.get(id)}catch(e){}
  if(!b){alert('This file is not on this device. It may have been uploaded from another phone or computer, or the browser data was cleared.');return}
  const url=URL.createObjectURL(b),mime=m.mime||b.type||'',d=document.createElement('div');d.className='ov';d.setAttribute('role','dialog');
  const body=mime.startsWith('image/')?'<img alt="'+esc(m.name)+'" src="'+url+'">':mime.startsWith('video/')?'<video src="'+url+'" controls playsinline style="max-width:100%;max-height:80vh;border-radius:10px;background:#000"></video>':mime=='application/pdf'?'<iframe title="'+esc(m.name)+'" src="'+url+'" style="width:min(100%,900px);height:80vh;height:80dvh;border:0;background:#fff;border-radius:10px"></iframe><p class="mut" style="color:#fff">If the PDF does not show, tap Download.</p>':'<p class="mut" style="color:#fff">No preview for this file type. Tap Download to open it.</p>';
  d.innerHTML='<div class="ovbar"><button type="button" class="btn back">Back</button> <a class="btn" href="'+url+'" download="'+esc(m.name)+'">Download</a></div>'+body;
  const close=()=>{d.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',onKey)},onKey=e=>{if(e.key=='Escape')close()};
  d.querySelector('.back').onclick=close;d.onclick=e=>{if(e.target===d)close()};document.addEventListener('keydown',onKey);document.body.appendChild(d)}
async function upDel(id){if(S.role!='admin')return;if(!confirm('Delete this file?'))return;try{await FDB.del(id)}catch(e){}S.up=S.up.filter(x=>x.id!=id);save();draw()}

let UPURLS=[],UPF='',UPA=false;
async function loadUploads(){
  UPURLS.forEach(u=>URL.revokeObjectURL(u));UPURLS=[];
  for(const el of [...document.querySelectorAll('[data-up]')]){
    const id=el.getAttribute('data-up'),m=S.up.find(x=>x.id==id);if(!m)continue;
    let b=null;try{b=await FDB.get(id)}catch(e){}
    if(!el.isConnected)return;
    if(!b){el.innerHTML='<div class="mut udoc">This file is not on this device.</div>';continue}
    const u=URL.createObjectURL(b);UPURLS.push(u);const mime=m.mime||b.type||'';
    el.innerHTML=mime.startsWith('image/')?'<img alt="'+esc(m.name)+'" src="'+u+'" onclick="upView(\''+m.id+'\')" style="cursor:zoom-in">':mime.startsWith('video/')?'<video src="'+u+'" controls playsinline preload="metadata"></video>':mime=='application/pdf'?'<iframe title="'+esc(m.name)+'" src="'+u+'"></iframe>':'<div class="udoc"><b>'+esc((m.name.split('.').pop()||'FILE').toUpperCase().slice(0,4))+'</b><span class="mut">'+esc(m.name)+'</span></div>';
    const a=el.parentNode.querySelector('.udl');if(a){a.href=u;a.download=m.name;a.style.display=''}}}
